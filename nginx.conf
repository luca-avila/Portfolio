# Servidor estático para el portfolio. Sirve el contenido de `out/` (build de
# Next.js con `output: "export"`) sin Node en runtime.
server {
    listen 80;
    server_name _;

    root /var/www/portfolio;
    index index.html;

    # `/en` -> `/en/` con redirección relativa: conserva esquema y puerto.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA estática: las rutas desconocidas caen al index exportado.
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # og:image generadas por Next (`/opengraph-image-<hash>`, `/en/opengraph-image`):
    # se exportan sin extensión, forzar el tipo PNG.
    location ~ /opengraph-image[^/]*$ {
        default_type image/png;
    }

    # Assets con hash de Next.js: cache larga e inmutable.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
